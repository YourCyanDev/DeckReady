name: Installer validation rev11

on:
  push:
    branches:
      - installer-validation-rev11
  workflow_dispatch:

jobs:
  validate-msi:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Create dummy payloads and UI assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force installer-tests\old\payload | Out-Null
          New-Item -ItemType Directory -Force installer-tests\new\payload | Out-Null
          Set-Content -LiteralPath installer-tests\old\payload\DeckReady.exe -Value 'OLD-DECKREADY-PAYLOAD' -Encoding ascii
          Set-Content -LiteralPath installer-tests\new\payload\DeckReady.exe -Value 'NEW-DECKREADY-PAYLOAD' -Encoding ascii
          New-Item -ItemType Directory -Force installer-tests\new\Assets | Out-Null
          Add-Type -AssemblyName System.Drawing
          $dialog = New-Object System.Drawing.Bitmap 493,312
          $g1 = [System.Drawing.Graphics]::FromImage($dialog)
          $g1.Clear([System.Drawing.Color]::White)
          $g1.Dispose()
          $dialog.Save((Join-Path $pwd 'installer-tests\new\Assets\InstallerDialog.png'), [System.Drawing.Imaging.ImageFormat]::Png)
          $dialog.Dispose()
          $banner = New-Object System.Drawing.Bitmap 493,58
          $g2 = [System.Drawing.Graphics]::FromImage($banner)
          $g2.Clear([System.Drawing.Color]::White)
          $g2.Dispose()
          $banner.Save((Join-Path $pwd 'installer-tests\new\Assets\InstallerBanner.png'), [System.Drawing.Imaging.ImageFormat]::Png)
          $banner.Dispose()
          Set-Content -LiteralPath installer-tests\new\Assets\License.rtf -Value '{\rtf1\ansi DeckReady Alpha License}' -Encoding ascii

      - name: Build old MSI
        shell: pwsh
        run: dotnet build installer-tests\old\DeckReady.Installer.wixproj -c Release --nologo

      - name: Build new MSI
        shell: pwsh
        run: dotnet build installer-tests\new\DeckReady.Installer.wixproj -c Release --nologo

      - name: Locate MSIs
        id: locate
        shell: pwsh
        run: |
          $old = Get-ChildItem installer-tests\old -Recurse -Filter DeckReady-old.msi | Select-Object -First 1
          $new = Get-ChildItem installer-tests\new -Recurse -Filter DeckReady-new.msi | Select-Object -First 1
          if (-not $old) { throw 'Old MSI not found' }
          if (-not $new) { throw 'New MSI not found' }
          "old=$($old.FullName)" >> $env:GITHUB_OUTPUT
          "new=$($new.FullName)" >> $env:GITHUB_OUTPUT
          Write-Host "Old MSI: $($old.FullName)"
          Write-Host "New MSI: $($new.FullName)"

      - name: Verify wizard UI tables
        shell: pwsh
        run: |
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $db = $installer.OpenDatabase('${{ steps.locate.outputs.new }}', 0)
          $view = $db.OpenView('SELECT `Dialog` FROM `Dialog`')
          $view.Execute()
          $dialogs = @()
          while ($rec = $view.Fetch()) { $dialogs += $rec.StringData(1) }
          $view.Close()
          Write-Host "Dialogs: $($dialogs -join ', ')"
          foreach ($required in @('WelcomeDlg','LicenseAgreementDlg','InstallDirDlg','DesktopShortcutDlg','VerifyReadyDlg','ProgressDlg','ExitDialog')) {
            if ($dialogs -notcontains $required) { throw "Required setup dialog missing: $required" }
          }

          $cv = $db.OpenView("SELECT `Dialog_`, `Control_`, `Event`, `Argument`, `Condition` FROM `ControlEvent` WHERE `Dialog_`='DesktopShortcutDlg'")
          $cv.Execute()
          $rows = @()
          while ($rec = $cv.Fetch()) {
            $rows += "$($rec.StringData(2))|$($rec.StringData(3))|$($rec.StringData(4))|$($rec.StringData(5))"
          }
          $cv.Close()
          Write-Host "DesktopShortcutDlg events: $($rows -join '; ')"
          if (-not ($rows | Where-Object { $_ -like 'Next|AddLocal|DesktopShortcutFeature*' })) { throw 'AddLocal event for desktop feature missing' }
          if (-not ($rows | Where-Object { $_ -like 'Next|Remove|DesktopShortcutFeature*' })) { throw 'Remove event for desktop feature missing' }

      - name: Install old MSI silently
        shell: pwsh
        run: |
          $p = Start-Process msiexec.exe -ArgumentList @('/i', '${{ steps.locate.outputs.old }}', '/qn', '/norestart', '/L*V', "$pwd\old-install.log") -Wait -PassThru
          Write-Host "Old install exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { Get-Content "$pwd\old-install.log" -Tail 120; exit $p.ExitCode }
          $installed = Join-Path $env:ProgramFiles 'DeckReady\DeckReady.exe'
          if (-not (Test-Path $installed)) { throw "Old payload missing: $installed" }
          Write-Host (Get-Content $installed -Raw)

      - name: Install new MSI as upgrade
        shell: pwsh
        run: |
          $p = Start-Process msiexec.exe -ArgumentList @('/i', '${{ steps.locate.outputs.new }}', '/qn', '/norestart', '/L*V', "$pwd\new-install.log") -Wait -PassThru
          Write-Host "New install exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { Get-Content "$pwd\new-install.log" -Tail 160; exit $p.ExitCode }
          $installed = Join-Path $env:ProgramFiles 'DeckReady\DeckReady.exe'
          if (-not (Test-Path $installed)) { throw "New payload missing: $installed" }
          $content = Get-Content $installed -Raw
          Write-Host "Installed content: $content"
          if ($content -notmatch 'NEW-DECKREADY-PAYLOAD') { throw 'New MSI did not replace old payload' }

      - name: Test desktop shortcut feature off
        shell: pwsh
        run: |
          $p = Start-Process msiexec.exe -ArgumentList @('/i', '${{ steps.locate.outputs.new }}', 'ADDLOCAL=MainFeature', '/qn', '/norestart', '/L*V', "$pwd\\shortcut-off.log") -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$pwd\\shortcut-off.log" -Tail 160; exit $p.ExitCode }
          $shortcut = Join-Path $env:PUBLIC 'Desktop\\DeckReady.lnk'
          if (Test-Path $shortcut) { throw "Desktop shortcut exists even though feature was not selected: $shortcut" }
          $p2 = Start-Process msiexec.exe -ArgumentList @('/x', '${{ steps.locate.outputs.new }}', '/qn', '/norestart') -Wait -PassThru
          if ($p2.ExitCode -ne 0) { exit $p2.ExitCode }

      - name: Test desktop shortcut feature on
        shell: pwsh
        run: |
          $p = Start-Process msiexec.exe -ArgumentList @('/i', '${{ steps.locate.outputs.new }}', 'ADDLOCAL=MainFeature,DesktopShortcutFeature', '/qn', '/norestart', '/L*V', "$pwd\\shortcut-on.log") -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$pwd\\shortcut-on.log" -Tail 160; exit $p.ExitCode }
          $shortcut = Join-Path $env:PUBLIC 'Desktop\\DeckReady.lnk'
          if (-not (Test-Path $shortcut)) { throw "Desktop shortcut was not created: $shortcut" }
          $p2 = Start-Process msiexec.exe -ArgumentList @('/x', '${{ steps.locate.outputs.new }}', '/qn', '/norestart') -Wait -PassThru
          if ($p2.ExitCode -ne 0) { exit $p2.ExitCode }
          if (Test-Path $shortcut) { throw "Desktop shortcut still exists after uninstall: $shortcut" }

      - name: Uninstall new MSI silently
        shell: pwsh
        run: |
          $p = Start-Process msiexec.exe -ArgumentList @('/x', '${{ steps.locate.outputs.new }}', '/qn', '/norestart', '/L*V', "$pwd\new-uninstall.log") -Wait -PassThru
          Write-Host "Uninstall exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 1605) { Get-Content "$pwd\new-uninstall.log" -Tail 160; exit $p.ExitCode }
          $installed = Join-Path $env:ProgramFiles 'DeckReady\DeckReady.exe'
          if (Test-Path $installed) { throw "DeckReady.exe still exists after uninstall: $installed" }

      - name: Upload MSI logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-validation-rev11-logs
          path: |
            *.log
